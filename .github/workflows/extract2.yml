name: Extract AI Messenger source

on:
  push:
    paths:
      - "extract-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          test -f "ai-messenger (1).zip"
          tmp_dir="$(mktemp -d)"
          unzip -q "ai-messenger (1).zip" -d "$tmp_dir"
          if [ -d "$tmp_dir/ai-messenger" ]; then src="$tmp_dir/ai-messenger"; else src="$tmp_dir"; fi
          rsync -a --exclude='.github/workflows/' "$src/" ./
          rm -rf "$tmp_dir"
          rm -f "ai-messenger (1).zip" extract-trigger.txt
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Extract AI Messenger source from ZIP"
          git push
