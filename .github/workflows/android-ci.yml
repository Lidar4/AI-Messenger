name: Android CI / Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew
    - name: Run Room KSP and Compile Checks
      run: ./gradlew compileDebugSources --no-daemon
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon
    - name: Verify Artifact Exists
      run: |
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "Debug APK build failed! File not found."
          exit 1
        fi
    - name: Generate SHA-256 Checksum
      run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/debug/app-debug.apk.sha256
