name: Extract project ZIP

on:
  push:
    paths:
      - "ai-messenger (1).zip"
      - ".github/workflows/extract-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project source
        shell: bash
        run: |
          set -euo pipefail
          test -f "ai-messenger (1).zip"
          tmp_dir="$(mktemp -d)"
          unzip -q "ai-messenger (1).zip" -d "$tmp_dir"
          if [ -d "$tmp_dir/ai-messenger" ]; then
            src="$tmp_dir/ai-messenger"
          else
            src="$tmp_dir"
          fi

          # Copy the project source, but leave GitHub workflow files for
          # the GitHub Contents API, which has explicit workflow permission.
          rsync -a --exclude='.github/workflows/' "$src/" ./
          rm -rf "$tmp_dir"
          rm -f "ai-messenger (1).zip"

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract AI Messenger source from uploaded ZIP"
          git push
